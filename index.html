<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>승우의 줄넘기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
/* VOICE: 승우가 주인공인 여름 운동장 애니메이션 게임
   IDEA: 비 갠 오후, 학교 야외 코트의 줄넘기 대회
   PICTURE: 반짝이는 젖은 코트 위에서 응원받으며 줄넘기하는 승우
   COLOUR and TYPE: 하늘 파랑 / 코트 빨강 / 노랑 포인트, Jua
   LAYOUT: 세로 전체화면 캔버스, 상단 HUD, 하단 안내 */
html,body{margin:0;height:100%;background:#123f73;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0;display:flex;justify-content:center;align-items:center}
#stg{position:relative;overflow:hidden}
#stg canvas{position:absolute;left:0;top:0;display:block;touch-action:none}
#cr{will-change:transform}
#sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(8,20,45,.55);padding:20px}
#sheet[hidden]{display:none}
#sheet .card{width:min(320px,100%);background:#fff;border:3px solid #13315c;border-radius:20px;padding:20px;font-family:Jua,"Apple SD Gothic Neo",sans-serif;color:#13315c;text-align:center;display:grid;gap:10px}
#sheet .t{font-size:26px}#sheet .s{font-size:15px;color:#5a6b80}
#sheet input,#sheet textarea{font:inherit;font-size:18px;padding:10px 12px;border:2px solid #9fb3cf;border-radius:12px;text-align:center;width:100%;box-sizing:border-box}
#sheet textarea{font-size:14px;min-height:60px}
#sheet button{font:inherit;font-size:18px;min-height:48px;border:0;border-radius:14px;color:#fff;background:#ff5a3c;cursor:pointer}
#sheet button:disabled{background:#b7c0cc}
#sheet #bCopy{background:#f0a81c}#sheet .ghost{background:#3a6fb5}
#sheet #m2{font-size:14px;color:#2c9a62;min-height:18px}
#phb{position:absolute;z-index:5;border-radius:50%;background:rgba(14,38,75,.85);border:2px solid #ffe14d;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;box-sizing:border-box}
#phb[hidden]{display:none}#phb img{width:100%;height:100%;object-fit:cover}#phb svg{width:56%;height:56%}
#crop{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(8,20,45,.7);padding:14px}
#crop[hidden]{display:none}
#crop .card{width:min(340px,100%);background:#fff;border:3px solid #13315c;border-radius:20px;padding:16px;font-family:Jua,"Apple SD Gothic Neo",sans-serif;color:#13315c;text-align:center;display:grid;gap:10px}
#crop .t{font-size:24px}#crop .s{font-size:14px;color:#5a6b80}
#cc{width:100%;aspect-ratio:1;border-radius:14px;touch-action:none;background:#e9eef5;cursor:grab}
#cz{width:100%;accent-color:#ff5a3c;height:28px}
#crop .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#crop button{font:inherit;font-size:18px;min-height:48px;border:0;border-radius:14px;color:#fff;background:#ff5a3c;cursor:pointer}
#crop .ghost{background:#3a6fb5}#crop .gray{background:#8a97a8}
#crop button:focus-visible,#phb:focus-visible{outline:3px solid #ffe14d;outline-offset:2px}
</style>
</head>
<body>
<div id="msg" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:#fff;font:18px/1.6 sans-serif;z-index:9">게임이 안 보이면<br>크롬 또는 사파리(인터넷 브라우저)로<br>이 파일을 열어주세요</div>
<div id="sheet" hidden><div class="card" role="dialog" aria-label="기록 남기기">
<div class="t">기록 남기기</div><div id="sc" class="s"></div>
<input id="nm" maxlength="8" placeholder="이름 (8자까지)" autocomplete="off">
<button id="bSave" type="button">순위표에 저장</button>
<button id="bCopy" type="button">결과 복사 (카톡 공유용)</button>
<textarea id="cp" hidden readonly></textarea>
<div id="m2" aria-live="polite"></div>
<button id="bClose" class="ghost" type="button">닫기</button>
</div></div>
<input type="file" id="pf" accept="image/*" hidden>
<div id="crop" hidden><div class="card" role="dialog" aria-label="얼굴 맞추기">
<div class="t">얼굴 맞추기</div>
<div class="s">사진을 끌어서 얼굴을 동그라미 안에 맞추세요<br>두 손가락이나 아래 막대로 크기 조절</div>
<canvas id="cc" width="560" height="560"></canvas>
<input id="cz" type="range" min="1" max="4" step="0.01" value="1" aria-label="사진 크기">
<div class="row"><button id="cNo" class="ghost" type="button">취소</button><button id="cOk" type="button">완료</button></div>
<button id="cDel" class="gray" type="button" hidden>사진 지우기</button>
</div></div>
<div id="wrap"><div id="stg"><label id="phb" for="pf" hidden aria-label="내 사진 넣기"></label><canvas id="bgc" aria-hidden="true"></canvas><canvas id="cr" aria-hidden="true"></canvas><canvas id="c" aria-label="승우의 줄넘기 게임 화면"></canvas></div></div>
<script>
if(!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.min(typeof r==='number'?r:(r&&r[0])||0,Math.abs(w)/2,Math.abs(h)/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath();return this}}
var m=document.getElementById('msg');if(m)m.style.display='none';
{
/* ===== 전체 순위표 주소 (구글 앱스스크립트 웹 앱 URL) ===== */
const VER='2026-11-27f';
const API='https://script.google.com/macros/s/AKfycbybco1Ml3YYJgA6rBGapPov9RtL4Cqsx1Lroovrv_SMy7gqdsVhpdBuZGOvIdoDBoVCJA/exec';
/* ========================================================== */
const cv=document.getElementById('c');let ctx=cv.getContext('2d');
const W=360,F='Jua,"Apple SD Gothic Neo","Malgun Gothic",sans-serif',OL='#2a1d1b';
let H=640,S=1,DPR=1,bg=null,crowd=null,CT=360,FY=512;

const SHOES=[
 {n:'기본 운동화',c:'#1f1f24',c2:'#3a3a44',a:'#ffffff',T:.42,H:72},
 {n:'빨간 농구화',c:'#d8302b',c2:'#f05a4a',a:'#ffffff',T:.50,H:86},
 {n:'하늘 에어',c:'#2584e0',c2:'#5fb2ff',a:'#ffe14d',T:.58,H:100},
 {n:'골드 점프화',c:'#e7a812',c2:'#ffd75a',a:'#7a4b00',T:.66,H:114},
 {n:'무지개 날개화',c:'#7d45f5',c2:'#c08bff',a:'#ffffff',T:.74,H:128,wing:1}
];

let save={cleared:0,equip:0,best:0};
try{const s=JSON.parse(localStorage.getItem('jr_save'));if(s&&s.cleared>=0)save=Object.assign(save,s)}catch(e){}
function store(){try{localStorage.setItem('jr_save',JSON.stringify(save))}catch(e){}}
if(!save.pid){save.pid=Date.now().toString(36)+Math.random().toString(36).slice(2,10);store()}
const owned=()=>Math.min(save.cleared+1,SHOES.length);
const shoeIdx=()=>Math.max(0,Math.min(save.equip|0,owned()-1));
function pickShoe(d){save.equip=(shoeIdx()+d+owned())%owned();store()}

function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function rr(x,y,w,h,r,c){c=c||ctx;c.beginPath();c.roundRect(x,y,w,h,r);c.fill()}
function mk(){const c=document.createElement('canvas');c.width=cv.width;c.height=cv.height;const x=c.getContext('2d');x.scale(S*DPR,S*DPR);return[c,x]}
function poly(c,pts){c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath()}

const QD=[2,1.5,1];let QL=0;
function resize(){
 const vw=innerWidth,vh=innerHeight;
 H=Math.round(Math.min(Math.max(vh/vw*W,580),800));
 S=Math.min(vw/W,vh/H);DPR=Math.min(devicePixelRatio||1,QD[QL]);
 const stg=document.getElementById('stg');stg.style.width=W*S+'px';stg.style.height=H*S+'px';
 for(const c of[cv,document.getElementById('bgc'),document.getElementById('cr')]){c.style.width=W*S+'px';c.style.height=H*S+'px';c.width=Math.round(W*S*DPR);c.height=Math.round(H*S*DPR)}
 CT=Math.round(H*.58);FY=H-130;
 if(typeof SPR!=='undefined')SPR.clear();
 buildCrowd();buildBg();paintLayers();
}
function paintLayers(){
 const b=document.getElementById('bgc').getContext('2d');b.setTransform(1,0,0,1,0,0);b.clearRect(0,0,cv.width,cv.height);b.drawImage(bg,0,0);
 const c=document.getElementById('cr').getContext('2d');c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,cv.width,cv.height);c.drawImage(crowd,0,0);
}
let crOff=-1;

/* ---------- background (pre-rendered) ---------- */
function cloud(x,cx,cy,r,R){
 const[c,k]=mk();
 const n=7+Math.floor(R()*4);
 k.fillStyle='#fff';
 for(let i=0;i<n;i++){const a=i/n;k.beginPath();k.arc(cx+(a-.5)*r*3.2,cy-Math.sin(a*Math.PI)*r*.7+(R()-.5)*r*.3,r*(.45+R()*.35+Math.sin(a*Math.PI)*.3),0,7);k.fill()}
 k.beginPath();k.ellipse(cx,cy+r*.1,r*1.8,r*.45,0,0,7);k.fill();
 k.globalCompositeOperation='source-atop';
 const g=k.createLinearGradient(0,cy-r*1.3,0,cy+r*.6);
 g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.55,'rgba(225,236,250,.4)');g.addColorStop(1,'rgba(150,185,225,.85)');
 k.fillStyle=g;k.fillRect(cx-r*3,cy-r*2,r*6,r*3);
 const g2=k.createRadialGradient(cx-r,cy-r,1,cx-r,cy-r,r*1.4);g2.addColorStop(0,'rgba(255,255,255,.9)');g2.addColorStop(1,'rgba(255,255,255,0)');
 k.fillStyle=g2;k.fillRect(cx-r*3,cy-r*2,r*6,r*3);
 x.drawImage(c,0,0,W,H);
}
function tree(x,tx,ty,r,R,far){
 const base=far?['#4f8f55','#68a866','#8cc47a']:['#1f5a24','#2f7a2e','#56a23c'];
 x.fillStyle=base[0];
 for(let i=0;i<9;i++){x.beginPath();x.arc(tx+(R()-.5)*r*1.4,ty+(R()-.3)*r*.9,r*(.35+R()*.3),0,7);x.fill()}
 x.fillStyle=base[1];
 for(let i=0;i<8;i++){x.beginPath();x.arc(tx-r*.15+(R()-.5)*r*1.1,ty-r*.15+(R()-.6)*r*.7,r*(.25+R()*.22),0,7);x.fill()}
 x.fillStyle=base[2];
 for(let i=0;i<7;i++){x.beginPath();x.arc(tx-r*.35+(R()-.5)*r*.7,ty-r*.4+(R()-.5)*r*.4,r*(.1+R()*.14),0,7);x.fill()}
 x.fillStyle=far?'rgba(220,245,200,.35)':'rgba(210,240,140,.45)';
 for(let i=0;i<10;i++){x.beginPath();x.arc(tx-r*.4+(R()-.5)*r*.8,ty-r*.55+(R()-.5)*r*.3,1.5+R()*2.5,0,7);x.fill()}
}
function buildBg(){
 const[c,x]=mk();bg=c;const R=rng(11);
 let g=x.createLinearGradient(0,0,0,CT);
 g.addColorStop(0,'#0d55c4');g.addColorStop(.45,'#2f8ef0');g.addColorStop(.85,'#8cc8f6');g.addColorStop(1,'#cfe8fb');
 x.fillStyle=g;x.fillRect(0,0,W,CT);
 for(let i=0;i<10;i++)cloud(x,R()*W*1.1-15,30+R()*CT*.38,13+R()*17,R);
 // sun + flare
 const sx=58,sy=30;
 let sg=x.createRadialGradient(sx,sy,1,sx,sy,150);
 sg.addColorStop(0,'rgba(255,255,255,1)');sg.addColorStop(.08,'rgba(255,255,240,.95)');sg.addColorStop(.3,'rgba(255,250,215,.35)');sg.addColorStop(1,'rgba(255,255,255,0)');
 x.fillStyle=sg;x.fillRect(0,0,260,240);
 x.save();x.translate(sx,sy);x.globalCompositeOperation='lighter';
 for(let i=0;i<12;i++){x.rotate(Math.PI/6+R()*.2);const l=60+R()*70;const lg=x.createLinearGradient(0,0,l,0);lg.addColorStop(0,'rgba(255,255,230,.35)');lg.addColorStop(1,'rgba(255,255,230,0)');x.fillStyle=lg;x.beginPath();x.moveTo(0,-1.5);x.lineTo(l,0);x.lineTo(0,1.5);x.fill()}
 x.restore();
 x.save();x.globalCompositeOperation='lighter';
 [[.35,7,'rgba(140,255,200,.18)'],[.55,14,'rgba(120,180,255,.15)'],[.7,5,'rgba(255,200,140,.25)']].forEach(([f,r,col])=>{x.fillStyle=col;x.beginPath();x.arc(sx+(W*.7)*f,sy+(CT*.55)*f,r,0,7);x.fill()});
 x.restore();
 // trees: far then near
 const fT=CT-H*.2;
 for(let i=0;i<14;i++)tree(x,-10+i*28+R()*10,fT-58+R()*16,26+R()*12,R,1);
 for(let i=0;i<16;i++)tree(x,-14+i*25+R()*8,fT-18+R()*24,28+R()*16,R,0);
 x.fillStyle='#1d4f22';x.fillRect(0,fT+8,W,CT-fT);
 // light pole
 const pg=x.createLinearGradient(304,0,313,0);pg.addColorStop(0,'#f2f4f6');pg.addColorStop(1,'#8f969e');
 x.fillStyle=pg;x.fillRect(304,fT-118,8,CT-fT+118);
 x.fillStyle='#d9dde2';rr(286,fT-140,44,22,4,x);x.fillStyle='#9aa1a9';x.fillRect(286,fT-122,44,3);
 for(let i=0;i<2;i++)for(let j=0;j<3;j++){const lx=294+j*14,ly=fT-134+i*9;const lg=x.createRadialGradient(lx,ly,0,lx,ly,6);lg.addColorStop(0,'#fff');lg.addColorStop(1,'#e4e9c8');x.fillStyle=lg;x.beginPath();x.arc(lx,ly,4,0,7);x.fill()}
 // fence
 x.strokeStyle='rgba(205,215,220,.5)';x.lineWidth=.7;
 for(let i=-120;i<W+120;i+=8){x.beginPath();x.moveTo(i,fT);x.lineTo(i+(CT-fT),CT);x.stroke();x.beginPath();x.moveTo(i,fT);x.lineTo(i-(CT-fT),CT);x.stroke()}
 for(let i=0;i<W;i+=72){const fg=x.createLinearGradient(i+3,0,i+9,0);fg.addColorStop(0,'#dfe4e8');fg.addColorStop(1,'#6c757c');x.fillStyle=fg;x.fillRect(i+3,fT-6,6,CT-fT+6)}
 const rg=x.createLinearGradient(0,fT-7,0,fT-2);rg.addColorStop(0,'#eef1f3');rg.addColorStop(1,'#7c858c');x.fillStyle=rg;x.fillRect(0,fT-7,W,5);
 banner(x,12,fT+4,150,56,'#c62a22','#e8493c','필승!','승우 화이팅','#fff');
 banner(x,178,fT,150,56,'#14284a','#284a7d','줄넘기 왕','승우 응원단','#ff5a4e');
 // snapshot for reflection
 const[top]=mk();top.getContext('2d').drawImage(c,0,0);top.getContext('2d').drawImage(crowd,0,0);
 // court
 g=x.createLinearGradient(0,CT,0,H);g.addColorStop(0,'#2a9467');g.addColorStop(1,'#176a45');
 x.fillStyle=g;x.fillRect(0,CT,W,H-CT);
 g=x.createLinearGradient(0,CT,0,H);g.addColorStop(0,'#c4503a');g.addColorStop(1,'#9a3424');
 x.fillStyle=g;x.beginPath();x.moveTo(-10,CT+16);x.lineTo(W+10,CT+16);x.lineTo(W+90,H);x.lineTo(-90,H);x.closePath();x.fill();
 // reflection of scene
 x.save();x.beginPath();x.rect(0,CT,W,H-CT);x.clip();
 x.globalAlpha=.15;x.translate(0,CT*2);x.scale(1,-1);x.drawImage(top,0,0,W,H);
 x.restore();
 // lines
 x.strokeStyle='rgba(255,255,255,.92)';x.lineWidth=2.5;
 x.beginPath();x.moveTo(-10,CT+16);x.lineTo(W+10,CT+16);x.stroke();
 x.beginPath();x.ellipse(W/2,CT+16,150,(FY-CT)*.55,0,0,Math.PI);x.stroke();
 x.beginPath();x.moveTo(-30,H-40);x.lineTo(W+30,H-40);x.stroke();
 // wet gloss + puddles
 for(let i=0;i<9;i++){
  const gx=R()*W,gy=CT+24+R()*(H-CT-30),rw=30+R()*60;
  const gl=x.createRadialGradient(gx,gy,1,gx,gy,rw);gl.addColorStop(0,'rgba(255,255,255,.28)');gl.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=gl;x.beginPath();x.ellipse(gx,gy,rw,rw*.14,0,0,7);x.fill();
 }
 for(let i=0;i<5;i++){
  const px=R()*W,py=CT+40+R()*(H-CT-60);
  x.fillStyle='rgba(150,200,255,.18)';x.beginPath();x.ellipse(px,py,18+R()*22,3+R()*3,0,0,7);x.fill();
 }
 // sun light sweep + vignette
 g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'rgba(255,245,210,.18)');g.addColorStop(.5,'rgba(255,255,255,0)');
 x.fillStyle=g;x.fillRect(0,0,W,H);
 const vg=x.createRadialGradient(W/2,H*.45,H*.35,W/2,H*.45,H*.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(10,20,40,.35)');
 x.fillStyle=vg;x.fillRect(0,0,W,H);
}
function banner(x,bx,by,w,h,c1,c2,t1,t2,tc){
 x.strokeStyle='#eee';x.lineWidth=1;
 x.beginPath();x.moveTo(bx+3,by+3);x.lineTo(bx-2,by-6);x.moveTo(bx+w-3,by+3);x.lineTo(bx+w+2,by-6);x.stroke();
 x.fillStyle='rgba(0,0,0,.25)';x.fillRect(bx+3,by+4,w,h);
 const g=x.createLinearGradient(bx,0,bx+w,0);
 for(let i=0;i<=6;i++)g.addColorStop(i/6,i%2?c2:c1);
 x.fillStyle=g;x.beginPath();x.moveTo(bx,by);x.lineTo(bx+w,by);x.quadraticCurveTo(bx+w+2,by+h/2,bx+w,by+h);x.quadraticCurveTo(bx+w/2,by+h-4,bx,by+h);x.closePath();x.fill();
 x.fillStyle='rgba(255,255,255,.15)';x.fillRect(bx,by,w,4);
 x.textAlign='center';x.textBaseline='middle';
 x.lineWidth=4;x.strokeStyle='rgba(0,0,0,.35)';x.font='27px '+F;x.strokeText(t1,bx+w/2,by+21);
 x.fillStyle=tc;x.fillText(t1,bx+w/2,by+21);
 x.fillStyle='#fff';x.font='13px '+F;x.fillText(t2,bx+w/2,by+43);
}
function buildCrowd(){
 const[c,x]=mk();crowd=c;const R=rng(5);
 const skins=['#f3cba7','#ecbc94','#f7d6b8','#e2ad85'],hairs=['#141418','#231a16','#2c211b','#3b2a20'];
 for(let row=0;row<3;row++){
  const yb=CT-2-row*12,sc=1.08-row*.13;
  for(let i=0;i<28;i++){
   const fx=4+i*13.2+(row%2)*6.5+(R()-.5)*4,s=sc*(.92+R()*.16);
   const girl=R()<.5,up=R()<.5,sk=skins[Math.floor(R()*4)],hc=hairs[Math.floor(R()*4)];
   const shirt=R()<.12?'#c7362e':R()<.15?'#26375c':'#f6f6f3';
   x.save();x.translate(fx,yb);x.scale(s,s);
   x.globalAlpha=1-row*.1;
   x.fillStyle=sk;x.fillRect(-3.6,-12,2.6,12);x.fillRect(1,-12,2.6,12);
   x.fillStyle='#f4f4f4';x.fillRect(-3.8,-4,3,3);x.fillRect(.8,-4,3,3);
   x.fillStyle=girl?'#2a3350':'#3a3f4c';
   if(girl){x.beginPath();x.moveTo(-6,-17);x.lineTo(6,-17);x.lineTo(7.5,-10);x.lineTo(-7.5,-10);x.closePath();x.fill()}
   else x.fillRect(-5.5,-17,11,9);
   x.fillStyle=shirt;rr(-6,-30,12,14,2.5,x);
   x.fillStyle='rgba(120,130,150,.35)';x.fillRect(2,-30,4,14);

let phShown=null;
function placePh(){const b=$('phb');b.style.left=(12*S)+'px';b.style.top=(14*S)+'px';b.style.width=b.style.height=(44*S)+'px'}
function syncPh(){const v=st==='title'&&$('sheet').hidden&&$('crop').hidden;if(v!==phShown){phShown=v;$('phb').hidden=!v}}
// crop
const cc=$('cc'),cg=cc.getContext('2d'),CS=560,CR=232;
let cImg=null,cMin=1,cZ=1,cX=0,cY=0;const cP=new Map();
function cScale(){return cMin*cZ}
function cClamp(){if(!cImg)return;const w=cImg.naturalWidth*cScale()/2,h=cImg.naturalHeight*cScale()/2;cX=Math.max(CR-w,Math.min(w-CR,cX));cY=Math.max(CR-h,Math.min(h-CR,cY))}
function cDraw(){
 cg.fillStyle='#e9eef5';cg.fillRect(0,0,CS,CS);
 if(cImg){const sc=cScale(),w=cImg.naturalWidth*sc,h=cImg.naturalHeight*sc;cg.drawImage(cImg,CS/2+cX-w/2,CS/2+cY-h/2,w,h)}
 cg.fillStyle='rgba(8,20,45,.62)';cg.beginPath();cg.rect(0,0,CS,CS);cg.arc(CS/2,CS/2,CR,0,7);cg.fill('evenodd');
 cg.strokeStyle='#ffe14d';cg.lineWidth=6;cg.beginPath();cg.arc(CS/2,CS/2,CR,0,7);cg.stroke();
}
function cSetZ(z){const o=cScale();cZ=Math.max(1,Math.min(4,z));const k=cScale()/o;cX*=k;cY*=k;$('cz').value=cZ;cClamp();cDraw()}
function openCrop(file){
 const url=URL.createObjectURL(file),im=new Image();
 im.onload=()=>{cImg=im;cMin=2*CR/Math.min(im.naturalWidth,im.naturalHeight);cZ=1;cX=cY=0;$('cz').value=1;$('cDel').hidden=!save.photo;$('crop').hidden=false;syncPh();cDraw()};
 im.onerror=()=>{URL.revokeObjectURL(url);alertMsg('사진을 열 수 없어요')};
 im.src=url;
}
function alertMsg(m){pop(m,'#ff6b5e',H*.4)}
$('pf').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(f)openCrop(f)});
$('phb').addEventListener('click',e=>{if(save.photo){e.preventDefault();cImg=null;$('cDel').hidden=false;$('crop').hidden=false;syncPh();const im=new Image();im.onload=()=>{cImg=im;cMin=2*CR/Math.min(im.naturalWidth,im.naturalHeight);cZ=1;cX=cY=0;$('cz').value=1;cDraw()};im.src=save.photo;cDraw()}});
cc.addEventListener('pointerdown',e=>{e.preventDefault();cc.setPointerCapture(e.pointerId);cP.set(e.pointerId,{x:e.clientX,y:e.clientY})});
cc.addEventListener('pointermove',e=>{
 if(!cP.has(e.pointerId)||!cImg)return;
 const k=CS/cc.clientWidth,prev=[...cP.values()].map(q=>({...q}));
 cP.set(e.pointerId,{x:e.clientX,y:e.clientY});const now=[...cP.values()];
 if(now.length===1){cX+=(now[0].x-prev[0].x)*k;cY+=(now[0].y-prev[0].y)*k;cClamp();cDraw()}
 else if(now.length>=2){
  const d0=Math.hypot(prev[0].x-prev[1].x,prev[0].y-prev[1].y),d1=Math.hypot(now[0].x-now[1].x,now[0].y-now[1].y);
  const mx=((now[0].x+now[1].x)-(prev[0].x+prev[1].x))/2*k,my=((now[0].y+now[1].y)-(prev[0].y+prev[1].y))/2*k;
  cX+=mx;cY+=my;if(d0>0)cSetZ(cZ*d1/d0);else{cClamp();cDraw()}
 }
});
const cUp=e=>{cP.delete(e.pointerId)};
cc.addEventListener('pointerup',cUp);cc.addEventListener('pointercancel',cUp);
cc.addEventListener('wheel',e=>{e.preventDefault();cSetZ(cZ*(e.deltaY<0?1.08:1/1.08))},{passive:false});
$('cz').addEventListener('input',e=>cSetZ(Number(e.target.value)));
function closeCrop(){$('crop').hidden=true;cP.clear();syncPh()}

 g.fillStyle='#fff';g.fillRect(0,0,160,160);g.drawImage(cImg,(CS/2+cX-w/2-(CS/2-CR))*k,(CS/2+cY-h/2-(CS/2-CR))*k,w*k,h*k);

  const g=gt+Math.min(.1,Math.max(0,(performance.now()-last)/1000));
  if(g-lastTap<.15)return;
  if(Math.abs(g-nextReq)<=wt)hit(g);else if(armed)miss('너무 빨라요!');
  return;
 }
 if(st==='ready'){if(cd<=0)begin();return}
 for(const b of btns)if(b.on&&px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h){snd(660,.08,'triangle',.06);b.fn();return}
}
cv.addEventListener('pointerdown',e=>{
 e.preventDefault();const r=cv.getBoundingClientRect();
 tap((e.clientX-r.left)/S,(e.clientY-r.top)/S);
},{passive:false});
window.addEventListener('keydown',e=>{if(!$('sheet').hidden)return;if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(st==='play'||st==='ready')tap(0,0)}});
window.addEventListener('resize',resize);
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame()});
window.addEventListener('blur',pauseGame);


resize();placePh();loadFace();
window.addEventListener('resize',placePh);
loadBoard(1);
let newVer=null;
const BASE=location.href.split('#')[0].split('?')[0];
function refreshBase(){try{return fetch(BASE,{cache:'reload'}).catch(()=>{})}catch(e){return Promise.resolve()}}
if(/[?&]v=/.test(location.search))refreshBase();
try{
 const base=BASE;
 fetch(base+'?nc='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(tx=>{
  const mv=tx.match(/const VER='([^']+)'/);
  if(mv&&mv[1]!==VER){let tried='';try{tried=sessionStorage.getItem('jr_ver')||''}catch(e){}if(tried!==mv[1])newVer=mv[1]}
 }).catch(()=>{});
}catch(e){}
function checkVer(){
 if(!newVer||st!=='title'||!$('sheet').hidden)return;
 try{sessionStorage.setItem('jr_ver',newVer)}catch(e){}
 const v=newVer;newVer=null;
 refreshBase().then(()=>location.replace(BASE+'?v='+encodeURIComponent(v)));
}
if(document.fonts&&document.fonts.load)document.fonts.load('20px Jua').then(()=>{buildBg();paintLayers()}).catch(()=>{});
let last=performance.now();
let ema=.016,slowT=0;
function frame(now){
 let dt=Math.min(.1,(now-last)/1000);last=now;
 if(st==='play'){ema=ema*.9+dt*.1;if(ema>.024&&QL<2){slowT+=dt;if(slowT>1.5){QL++;slowT=0;ema=.016;resize()}}else slowT=0}
 while(dt>0){const s=Math.min(.02,dt);update(s);dt-=s}
 draw();syncPh();checkVer();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
}
</script>
